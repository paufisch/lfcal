# Lint and tests on every push and pull request; tests/test_reproduce.py compares with the recorded results/.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the pinned dependencies (fails if uv.lock is out of date)
        run: uv sync --locked
      - name: Lint
        run: uvx ruff@0.17.1 check src experiments tests examples
      - name: Test
        run: uv run pytest -rs
