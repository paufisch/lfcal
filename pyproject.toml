[project]
name = "lfcal"
version = "0.1.0"
description = "Calibrated latent force inference with probabilistic ODE solvers: the algorithm and the code of 'Stable and Calibrated Latent Force ODE Filters'."
readme = "README.md"
authors = [{ name = "Paul Fischer" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
# Pinned to the versions that produced the recorded results, so a re-run reproduces them.
dependencies = [
    "jax==0.10.2",
    "jaxlib==0.10.2",
    "numpy==2.4.6",
    "scipy==1.18.0",
    "matplotlib==3.11.0",
    "tueplots==0.2.4",
    "diffrax==0.7.2",
    "ode-filters==0.8.2",
    "ml-dtypes==0.5.4",
]

[project.urls]
Paper = "https://arxiv.org/abs/2610.33939"
Repository = "https://github.com/paufisch/lfcal"

[dependency-groups]
dev = ["coverage>=7", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfcal"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
# the tests import the experiment scripts (their load/save and compute functions)
pythonpath = ["experiments"]
